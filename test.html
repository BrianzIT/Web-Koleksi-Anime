<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My J-Vault - Ultimate Otaku Sanctuary</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 selection:bg-green-500/30 pb-44 relative min-h-screen overflow-x-hidden">

    <!-- Ambient Glow Effects (Hijau & Abu-abu) -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-green-500/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-gray-500/10 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Navigasi Utama -->
    <nav class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-xl border-b border-gray-800 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20 gap-4">
                <div class="flex items-center gap-3 cursor-pointer group shrink-0" onclick="switchTab('dashboard')">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-green-600 via-emerald-500 to-green-400 p-[2px] shadow-[0_0_25px_rgba(34,197,94,0.3)] group-hover:scale-105 transition-transform">
                        <div class="w-full h-full bg-gray-950 rounded-[14px] flex items-center justify-center">
                            <i data-lucide="leaf" class="text-green-400 w-6 h-6 animate-pulse"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-wider text-white">
                            MY <span class="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-300">J-VAULT</span>
                        </h1>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest font-semibold">Ultimate Otaku Sanctuary</p>
                    </div>
                </div>

                <!-- Input Pencarian -->
                <div class="hidden md:flex flex-1 max-w-md mx-4 relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i data-lucide="search" class="h-4 w-4 text-gray-500"></i>
                    </div>
                    <input 
                        type="text" 
                        id="searchInput" 
                        oninput="handleSearch(this.value)" 
                        placeholder="Eksplor koleksi favoritmu..." 
                        class="block w-full pl-10 pr-4 py-2.5 border border-gray-800 rounded-xl leading-5 bg-gray-900 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-green-500/50 focus:border-green-500 transition-all text-sm shadow-inner"
                    />
                </div>

                <!-- Tombol Buka MyAnimeList -->
                <button onclick="openMalBrowser()" class="px-4 py-2.5 rounded-xl text-xs font-black bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white shadow-[0_0_20px_rgba(34,197,94,0.3)] transition-all flex items-center gap-2 shrink-0">
                    <i data-lucide="globe" class="w-4 h-4"></i>
                    <span>MAL Browser</span>
                </button>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-gray-800/60">
            <div id="tabsContainer" class="flex space-x-2 py-3 overflow-x-auto no-scrollbar">
                <!-- Tabs rendered dynamically -->
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10" id="mainContent">
        <!-- Dynamic Content Rendered Here -->
    </main>

    <!-- Spotify-Style Bottom Player -->
    <div id="playerBar" class="hidden fixed bottom-0 left-0 right-0 z-50 bg-gray-900/95 backdrop-blur-2xl border-t border-gray-800 px-4 py-3.5 shadow-[0_-15px_40px_rgba(0,0,0,0.8)]">
        <div class="max-w-7xl mx-auto flex flex-col xl:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 w-full xl:w-1/4">
                <div class="w-12 h-12 rounded-xl bg-gray-800 overflow-hidden flex-shrink-0 border border-gray-700 shadow-md flex items-center justify-center">
                    <img id="playerImg" src="" class="w-full h-full object-cover" alt="" />
                </div>
                <div class="min-w-0 flex-1">
                    <h4 id="playerTitle" class="text-sm font-extrabold text-white truncate">Judul Lagu</h4>
                    <p class="text-xs text-green-400 font-bold truncate">Spotify / J-Vault Stream</p>
                </div>
                <button onclick="closePlayer()" class="text-gray-500 hover:text-white xl:hidden p-1.5"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="flex flex-col items-center w-full xl:w-2/4 gap-2">
                <div class="flex items-center gap-6">
                    <button onclick="prevSong()" class="text-gray-400 hover:text-white transition-colors"><i data-lucide="skip-back" class="w-5 h-5 fill-current"></i></button>
                    <button onclick="togglePlayPause()" id="playPauseBtn" class="w-11 h-11 bg-white hover:scale-105 text-gray-900 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.4)] transition-transform">
                        <i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>
                    </button>
                    <button onclick="nextSong()" class="text-gray-400 hover:text-white transition-colors"><i data-lucide="skip-forward" class="w-5 h-5 fill-current"></i></button>
                </div>
                <div class="flex items-center gap-3 w-full max-w-md">
                    <span id="currentTimeLabel" class="text-[11px] text-gray-400 font-mono">0:00</span>
                    <input type="range" id="progressBar" min="0" max="100" value="0" oninput="seekAudio(this.value)" class="w-full h-1.5 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-green-500 shadow-inner" />
                    <span id="durationLabel" class="text-[11px] text-gray-400 font-mono">0:00</span>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-end gap-3 w-full xl:w-1/4">
                <div class="flex items-center gap-1.5 bg-gray-950 px-2.5 py-1.5 rounded-xl border border-gray-800">
                    <i data-lucide="sliders" class="w-3.5 h-3.5 text-green-400"></i>
                    <select id="playbackRateSelect" onchange="changePlaybackRate(this.value)" class="bg-transparent text-xs text-gray-200 font-bold focus:outline-none cursor-pointer">
                        <option value="0.75" class="bg-gray-950">0.75x</option>
                        <option value="1.0" selected class="bg-gray-950">1.0x (Normal)</option>
                        <option value="1.25" class="bg-gray-950">1.25x</option>
                        <option value="1.5" class="bg-gray-950">1.5x</option>
                    </select>
                </div>

                <div class="hidden sm:flex items-center gap-2">
                    <button onclick="toggleMute()" id="muteBtn" class="text-gray-400 hover:text-white transition-colors"><i data-lucide="volume-2" class="w-5 h-5"></i></button>
                    <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)" class="w-16 h-1.5 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-green-500 shadow-inner" />
                </div>

                <button onclick="closePlayer()" class="hidden xl:block text-gray-500 hover:text-red-400 ml-1 p-1.5 rounded-xl hover:bg-red-500/10 transition-colors" title="Tutup Player"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
        </div>
    </div>

    <!-- MODAL MYANIMELIST IN-APP BROWSER -->
    <div id="malModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-2 sm:p-6 bg-black/80 backdrop-blur-md animate-fadeIn">
        <div class="bg-gray-900 border border-green-500/30 rounded-3xl w-full max-w-6xl h-[88vh] flex flex-col overflow-hidden shadow-[0_0_50px_rgba(34,197,94,0.2)]">
            <div class="p-3.5 sm:p-4 bg-gray-950 border-b border-gray-800 flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-green-500/20 text-green-400 border border-green-500/30 flex items-center justify-center">
                        <i data-lucide="globe" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-black text-white flex items-center gap-2">
                            MyAnimeList Browser
                        </h3>
                        <p class="text-[10px] text-gray-500">Jelajahi database anime & manga terlengkap</p>
                    </div>
                </div>

                <div class="flex-1 max-w-md flex items-center gap-2 my-1 sm:my-0">
                    <input type="text" id="malSearchQuery" placeholder="Cari Anime di MyAnimeList..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-green-500" onkeypress="if(event.key==='Enter') searchMalFromInput()" />
                    <button onclick="searchMalFromInput()" class="px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded-xl text-xs font-bold transition-colors">Cari</button>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="loadMalUrl('https://myanimelist.net/anime.php')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl text-xs font-bold border border-gray-700 transition-colors">Anime</button>
                    <button onclick="loadMalUrl('https://myanimelist.net/manga.php')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl text-xs font-bold border border-gray-700 transition-colors">Manga</button>
                    <a id="malExternalBtn" href="https://myanimelist.net" target="_blank" rel="noopener noreferrer" class="p-2 text-green-400 hover:bg-green-500/10 rounded-xl transition-colors" title="Buka di Tab Baru">
                        <i data-lucide="external-link" class="w-4 h-4"></i>
                    </a>
                    <button onclick="closeMalBrowser()" class="p-2 text-gray-500 hover:text-white hover:bg-red-500/10 hover:text-red-400 rounded-xl transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="flex-1 bg-white relative">
                <iframe id="malIframe" src="about:blank" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <!-- Modal Detail Item -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
        <div class="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl relative">
            <button onclick="closeDetailModal()" class="absolute top-4 right-4 z-20 w-8 h-8 bg-black/60 hover:bg-black text-white rounded-full flex items-center justify-center backdrop-blur-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
            <div class="h-64 w-full bg-black relative">
                <img id="detailImg" src="" class="w-full h-full object-cover" alt="" />
                <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
            </div>
            <div class="p-6 space-y-4 -mt-10 relative z-10">
                <div id="detailBadges" class="flex flex-wrap items-center gap-2"></div>
                <h3 id="detailTitle" class="text-2xl font-black text-white"></h3>
                <p id="detailStatus" class="text-sm font-semibold text-green-400"></p>
                <div class="bg-gray-950 p-4 rounded-2xl border border-gray-800">
                    <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Catatan Pribadi</h4>
                    <p id="detailNotes" class="text-sm text-gray-300 leading-relaxed"></p>
                </div>
                <div class="pt-2 flex gap-3">
                    <button onclick="closeDetailModal()" class="flex-1 py-2.5 bg-gray-950 border border-gray-700 text-white rounded-xl text-sm font-bold hover:bg-gray-800">Tutup</button>
                    <button id="detailDeleteBtn" class="px-4 py-2.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 rounded-xl text-sm font-bold transition-colors">Hapus</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Tambah Data -->
    <div id="addModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
        <div class="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center p-5 border-b border-gray-800 bg-gray-950">
                <h3 id="addModalTitle" class="text-base font-black text-white flex items-center gap-2">
                    <i data-lucide="plus" class="w-5 h-5 text-green-500"></i>
                    <span>Tambah Data Baru</span>
                </h3>
                <button onclick="closeAddModal()" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleFormSubmit(event)" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">Judul / Nama</label>
                    <input type="text" id="formTitle" required placeholder="Masukkan judul..." class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-green-500 text-sm" />
                </div>

                <div id="formAnimeFields" class="space-y-4">
                    <div>
                        <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">Status</label>
                        <select id="formStatus" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-sm">
                            <option value="Completed">Completed</option>
                            <option value="Watching">Watching</option>
                            <option value="Plan to Watch">Plan to Watch</option>
                            <option value="On-Hold">On-Hold</option>
                            <option value="Dropped">Dropped</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">Rating (1-10)</label>
                        <input type="number" id="formRating" min="1" max="10" step="0.1" value="10" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-2.5 text-white text-sm" />
                    </div>
                </div>

                <div id="formTierFields" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">Tier</label>
                        <select id="formTier" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-sm">
                            <option value="SS">SS (Tertinggi)</option>
                            <option value="S">S (Sangat Suka)</option>
                            <option value="A">A (Suka)</option>
                            <option value="B">B (Biasa)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">Rating (1-10)</label>
                        <input type="number" id="formRatingTier" min="1" max="10" step="0.1" value="10" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-2.5 text-white text-sm" />
                    </div>
                </div>

                <div id="formMusicFields" class="hidden space-y-3 pt-3 border-t border-gray-800">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">Tier</label>
                            <select id="formMusicTier" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3 py-2.5 text-white text-sm">
                                <option value="SS">SS (Tertinggi)</option>
                                <option value="S" selected>S (Sangat Suka)</option>
                                <option value="A">A (Suka)</option>
                                <option value="B">B (Biasa)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">Rating</label>
                            <input type="number" id="formMusicRating" min="1" max="10" step="0.1" value="10" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-2.5 text-white text-sm" />
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-extrabold text-green-400 uppercase tracking-wider mb-1.5">Perlu Musik?</label>
                        <select id="formHasMusic" onchange="toggleMusicInput(this.value)" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:border-green-500">
                            <option value="yes">Ya, Putar Musik di Web</option>
                            <option value="no">Tidak Perlu</option>
                        </select>
                    </div>
                    <div id="mediaUrlWrapper" class="p-3.5 bg-gray-950 rounded-2xl border border-green-500/30">
                        <label class="block text-xs font-extrabold text-green-400 uppercase tracking-wider mb-1.5">Direct Audio URL (.mp3)</label>
                        <input type="text" id="formMediaUrl" placeholder="https://.../song.mp3" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white text-sm focus:border-green-500" />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">URL Gambar / Poster</label>
                    <input type="text" id="formImage" placeholder="https://... (link gambar)" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-2.5 text-white text-sm focus:border-green-500" />
                </div>
                <div>
                    <label class="block text-xs font-extrabold text-gray-400 uppercase tracking-wider mb-1.5">Catatan / Review</label>
                    <textarea id="formNotes" rows="2" placeholder="Tambahkan catatan pribadi..." class="w-full bg-gray-950 border border-gray-700 rounded-xl px-3.5 py-2 text-white text-sm resize-none focus:border-green-500"></textarea>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeAddModal()" class="flex-1 px-4 py-2.5 bg-gray-950 border border-gray-700 text-white rounded-xl text-sm font-bold hover:bg-gray-800">Batal</button>
                    <button type="submit" class="flex-1 px-4 py-2.5 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white rounded-xl text-sm font-black shadow-[0_0_15px_rgba(34,197,94,0.3)] transition-all">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Hapus -->
    <div id="deleteModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
        <div class="bg-gray-900 border border-gray-700 rounded-3xl w-full max-w-sm p-6 text-center shadow-2xl">
            <div class="w-12 h-12 bg-red-500/15 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-red-500/20">
                <i data-lucide="trash-2" class="w-6 h-6"></i>
            </div>
            <h3 class="text-lg font-black text-white mb-2">Hapus Item Ini?</h3>
            <p class="text-gray-400 text-xs mb-6">Data yang dihapus tidak dapat dipulihkan kembali.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 px-4 py-2.5 bg-gray-950 border border-gray-700 text-white rounded-xl text-xs font-bold hover:bg-gray-800">Batal</button>
                <button onclick="executeDelete()" class="flex-1 px-4 py-2.5 bg-red-600 hover:bg-red-500 transition-colors text-white rounded-xl text-xs font-black shadow-lg">Hapus</button>
            </div>
        </div>
    </div>

    <script>
        const defaultData = [
            { 
                id: '1', 
                title: 'YOASOBI - Idol', 
                category: 'Lagu', 
                imageUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop', 
                mediaUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', 
                hasMusic: true, 
                rating: '10', 
                tier: 'SS', 
                status: '',
                notes: 'Lagu pembuka Oshi no Ko yang legendaris dan sangat ikonik!'
            },
            { 
                id: '2', 
                title: 'Kenshi Yonezu - KICK BACK', 
                category: 'Lagu', 
                imageUrl: 'https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=400&auto=format&fit=crop', 
                mediaUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 
                hasMusic: true, 
                rating: '10', 
                tier: 'SS', 
                status: '',
                notes: 'Opening Chainsaw Man dengan ritme energik.'
            },
            { 
                id: '3', 
                title: 'Frieren: Beyond Journey\'s End', 
                category: 'Anime', 
                imageUrl: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop', 
                mediaUrl: '', 
                hasMusic: false, 
                rating: '9.8', 
                tier: 'SS', 
                status: 'Completed',
                notes: 'Mahakarya fantasi dengan penceritaan yang emosional dan tenang.'
            }
        ];

        let items = JSON.parse(localStorage.getItem('jvault_items_html_v4')) || defaultData;
        let activeTab = 'dashboard';
        let searchQuery = '';
        let sortBy = 'newest';

        let currentSongId = null;
        let isPlaying = false;
        const audioElement = new Audio();
        let itemToDeleteId = null;
        let modalTargetCategory = 'Anime';
        let currentDetailItem = null;

        const tabsConfig = [
            { id: 'dashboard', icon: 'leaf', label: 'Dashboard' },
            { id: 'anime', icon: 'tv', label: 'Anime' },
            { id: 'drama', icon: 'tv', label: 'J-Drama' },
            { id: 'waifu', icon: 'heart', label: 'Waifu' },
            { id: 'husbu', icon: 'heart', label: 'Husbu' },
            { id: 'music', icon: 'music', label: 'J-Pop & OST' }
        ];

        function saveData() {
            localStorage.setItem('jvault_items_html_v4', JSON.stringify(items));
        }

        function initApp() {
            renderTabs();
            renderContent();
            setupAudioEvents();
            lucide.createIcons();
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = tabsConfig.map(tab => {
                const isActive = activeTab === tab.id;
                const activeClasses = isActive 
                    ? 'bg-gradient-to-r from-green-600 to-emerald-600 text-white shadow-[0_0_20px_rgba(34,197,94,0.3)] scale-105' 
                    : 'text-gray-400 hover:text-white hover:bg-gray-800';
                return `
                    <button onclick="switchTab('${tab.id}')" class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all whitespace-nowrap ${activeClasses}">
                        <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                        ${tab.label}
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function switchTab(tabId) {
            activeTab = tabId;
            renderTabs();
            renderContent();
        }

        function handleSearch(val) {
            searchQuery = val;
            renderContent();
        }

        function handleSort(val) {
            sortBy = val;
            renderContent();
        }

        function renderContent() {
            const main = document.getElementById('mainContent');
            if (activeTab === 'dashboard') {
                main.innerHTML = renderDashboardView();

                main.innerHTML = renderCategoryView();

            lucide.createIcons();
        }

                                    <span class="text-2xl font-black text-white">${stats.waifu + stats.husbu}</span>

                    <div class="grid md:grid-cols-2 gap-6">

                                <h3 class="text-sm font-extrabold text-white flex items-center gap-2 tracking-wider uppercase">

                            <div class="space-y-3 overflow-y-auto pr-2 flex-1">
                                ${topAnime.length > 0 ? topAnime.map(item => `

                                        </div>
                                        <div class="px-3 py-1.5 rounded-xl bg-gray-900 border border-gray-700 flex items-center gap-1.5">

                                            <span class="text-sm font-black text-yellow-400">${item.rating}</span>

                        </div>

                        <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 flex flex-col h-[420px] shadow-xl">
                            <div class="flex justify-between items-center mb-6">
                                <h3 class="text-sm font-extrabold text-white flex items-center gap-2 tracking-wider uppercase">
                                    <i data-lucide="crown" class="w-4 h-4 text-green-400 fill-current"></i> Top Tier Waifu & Husbu
                                </h3>
                                <button onclick="switchTab('waifu')" class="text-xs text-green-400 hover:text-green-300 font-bold">Lihat Shrine →</button>

        function renderCategoryView() {
            const targetCategory = activeTab === 'anime' ? 'Anime' : activeTab === 'drama' ? 'Drama' : activeTab === 'waifu' ? 'Waifu' : activeTab === 'husbu' ? 'Husbu' : 'Lagu';
            const pageTitle = activeTab === 'music' ? 'J-Pop & OST' : activeTab === 'drama' ? 'J-Drama' : activeTab.charAt(0).toUpperCase() + activeTab.slice(1);

            let filtered = items.filter(item => {
                if (searchQuery && !item.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                if (activeTab === 'anime' && item.category !== 'Anime') return false;
                if (activeTab === 'drama' && item.category !== 'Drama') return false;
                if (activeTab === 'waifu' && item.category !== 'Waifu') return false;
                if (activeTab === 'husbu' && item.category !== 'Husbu') return false;
                if (activeTab === 'music' && item.category !== 'Lagu') return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'rating') return parseFloat(b.rating || 0) - parseFloat(a.rating || 0);
                if (sortBy === 'title') return a.title.localeCompare(b.title);
                return parseInt(b.id) - parseInt(a.id);
            });

            const gridClasses = activeTab === 'music' ? 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3' : 'grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5';
            const imgRatio = activeTab === 'music' ? 'aspect-video' : 'aspect-[3/4]';

            return `
                <div class="space-y-6 animate-fadeIn">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gray-900 p-5 rounded-2xl border border-gray-800 shadow-lg">
                        <div class="flex items-center gap-3">
                            <h2 class="text-xl font-black text-white uppercase tracking-wider">${pageTitle} Vault</h2>
                            <span class="px-2.5 py-0.5 rounded-full bg-green-500/10 text-green-400 text-xs font-bold border border-green-500/20">${filtered.length} item</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center gap-2 bg-gray-950 px-3 py-1.5 rounded-xl border border-gray-800">
                                <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 text-gray-500"></i>
                                <select onchange="handleSort(this.value)" class="bg-transparent text-xs text-gray-300 font-semibold focus:outline-none cursor-pointer">
                                    <option value="newest" ${sortBy === 'newest' ? 'selected' : ''} class="bg-gray-950">Terbaru Ditambahkan</option>
                                    <option value="rating" ${sortBy === 'rating' ? 'selected' : ''} class="bg-gray-950">Rating Tertinggi</option>
                                    <option value="title" ${sortBy === 'title' ? 'selected' : ''} class="bg-gray-950">Judul (A-Z)</option>
                                </select>
                            </div>
                            <button onclick="openAddModal('${targetCategory}')" class="px-4 py-2 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white rounded-xl text-xs font-extrabold shadow-[0_0_15px_rgba(34,197,94,0.3)] transition-all flex items-center gap-2">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Baru
                            </button>
                        </div>
                    </div>

                    <div class="grid gap-5 md:gap-6 ${gridClasses}">
                        ${filtered.length > 0 ? filtered.map(item => {
                            const isCurrent = currentSongId === item.id;
                            return `
                                <div onclick="openDetailModal('${item.id}')" class="group relative bg-gray-900 border ${isCurrent ? 'border-green-500 shadow-[0_0_20px_rgba(34,197,94,0.3)]' : 'border-gray-800'} rounded-2xl overflow-hidden hover:border-green-500/60 transition-all flex flex-col cursor-pointer shadow-lg">
                                    <div class="${imgRatio} w-full bg-gray-950 relative overflow-hidden">
                                        <img src="${item.imageUrl}" alt="" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                        <div class="absolute top-3 left-3 flex gap-1.5 z-20">
                                            ${item.rating ? `<span class="px-2.5 py-1 rounded-lg bg-black/75 backdrop-blur-md border border-white/10 text-yellow-400 text-xs font-black flex items-center gap-1 shadow"><i data-lucide="star" class="w-3 h-3 fill-current"></i> ${item.rating}</span>` : ''}
                                            ${item.tier ? `<span class="px-2.5 py-1 rounded-lg bg-green-600/90 backdrop-blur-md border border-white/10 text-white text-xs font-black shadow">Tier ${item.tier}</span>` : ''}
                                        </div>
                                        ${item.category === 'Lagu' && item.hasMusic && item.mediaUrl ? `
                                            <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onclick="togglePlaySong(event, '${item.id}')" class="w-14 h-14 bg-green-600 hover:bg-green-500 text-white rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(34,197,94,0.8)] transition-transform transform hover:scale-110 z-30">
                                                    <i data-lucide="${isCurrent && isPlaying ? 'pause' : 'play'}" class="w-6 h-6 fill-current ${isCurrent && isPlaying ? '' : 'ml-0.5'}"></i>
                                                </button>
                                            </div>
                                        ` : ''}
                                    </div>
                                    <div class="p-4 flex-1 flex flex-col bg-gray-900 z-10 relative">
                                        <h3 class="text-sm font-bold text-white line-clamp-1 mb-1 group-hover:text-green-400 transition-colors">${item.title}</h3>
                                        <p class="text-xs text-gray-500 font-medium line-clamp-1 mb-3">
                                            ${item.category === 'Lagu' ? '<span class="flex items-center gap-1 text-green-400"><i data-lucide="radio" class="w-3 h-3"></i> Audio Player</span>' : (item.status || `Karakter ${item.category}`)}
                                        </p>
                                        <div class="mt-auto pt-3 border-t border-gray-800 flex items-center justify-between text-xs text-gray-600 font-bold">
                                            <span class="flex items-center gap-1 text-emerald-400"><i data-lucide="info" class="w-3.5 h-3.5"></i> Detail</span>
                                            <button onclick="event.stopPropagation(); promptDelete('${item.id}')" class="text-gray-500 hover:text-red-400 transition-colors p-1 rounded-lg hover:bg-red-500/10" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('') : `
                            <div class="col-span-full py-16 text-center border-2 border-dashed border-gray-800 rounded-3xl bg-gray-950">
                                <p class="text-gray-500 text-sm font-medium">Belum ada data di kategori ini. Klik "Tambah Baru" untuk mulai mencatat!</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // FUNGSI IN-APP MAL BROWSER
        function openMalBrowser(url = 'https://myanimelist.net/anime.php') {
            const modal = document.getElementById('malModal');
            loadMalUrl(url);
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeMalBrowser() {
            const modal = document.getElementById('malModal');
            const iframe = document.getElementById('malIframe');
            iframe.src = 'about:blank';
            modal.classList.add('hidden');
        }

        function loadMalUrl(url) {
            const iframe = document.getElementById('malIframe');
            const externalBtn = document.getElementById('malExternalBtn');
            iframe.src = url;
            externalBtn.href = url;
        }

        function searchMalFromInput() {
            const query = document.getElementById('malSearchQuery').value.trim();
            if (query) {
                const searchUrl = `https://myanimelist.net/anime.php?q=${encodeURIComponent(query)}&cat=anime`;
                loadMalUrl(searchUrl);
            }
        }

        // Audio Player Controls Logic
        function setupAudioEvents() {
            audioElement.addEventListener('timeupdate', () => {
                const current = audioElement.currentTime;
                const dur = audioElement.duration || 0;
                document.getElementById('currentTimeLabel').innerText = formatTime(current);
                document.getElementById('durationLabel').innerText = formatTime(dur);
                document.getElementById('progressBar').max = dur;
                document.getElementById('progressBar').value = current;
            });

            audioElement.addEventListener('ended', () => nextSong());
        }

        function togglePlaySong(e, id) {
            e.stopPropagation();
            const song = items.find(i => i.id === id);
            if (!song || !song.mediaUrl) return;

            if (currentSongId === id) {
                if (isPlaying) {
                    audioElement.pause();
                    isPlaying = false;
                } else {
                    audioElement.play().catch(() => {});
                    isPlaying = true;
                }
            } else {
                currentSongId = id;
                audioElement.src = song.mediaUrl;
                
                const currentRate = parseFloat(document.getElementById('playbackRateSelect').value) || 1.0;
                audioElement.playbackRate = currentRate;

                audioElement.play().catch(() => {});
                isPlaying = true;
                
                document.getElementById('playerBar').classList.remove('hidden');
                document.getElementById('playerTitle').innerText = song.title;
                document.getElementById('playerImg').src = song.imageUrl;
            }
            updatePlayPauseButtonUI();
            renderContent();
        }

        function togglePlayPause() {
            if (!currentSongId) return;
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
            } else {
                audioElement.play().catch(() => {});
                isPlaying = true;
            }
            updatePlayPauseButtonUI();
            renderContent();
        }

        function updatePlayPauseButtonUI() {
            const btn = document.getElementById('playPauseBtn');
            btn.innerHTML = `<i data-lucide="${isPlaying ? 'pause' : 'play'}" class="w-5 h-5 fill-current ${isPlaying ? '' : 'ml-0.5'}"></i>`;
            lucide.createIcons();
        }

        function closePlayer() {
            audioElement.pause();
            currentSongId = null;
            isPlaying = false;
            document.getElementById('playerBar').classList.add('hidden');
            renderContent();
        }

        function nextSong() {
            const songs = items.filter(i => i.category === 'Lagu' && i.hasMusic && i.mediaUrl);
            if (songs.length === 0) return;
            const idx = songs.findIndex(s => s.id === currentSongId);
            const nextIdx = (idx + 1) % songs.length;
            togglePlaySong({ stopPropagation: () => {} }, songs[nextIdx].id);
        }

        function prevSong() {
            const songs = items.filter(i => i.category === 'Lagu' && i.hasMusic && i.mediaUrl);
            if (songs.length === 0) return;
            const idx = songs.findIndex(s => s.id === currentSongId);
            const prevIdx = (idx - 1 + songs.length) % songs.length;
            togglePlaySong({ stopPropagation: () => {} }, songs[prevIdx].id);
        }

        function seekAudio(val) {
            audioElement.currentTime = val;
        }

        function changeVolume(val) {
            audioElement.volume = val;
        }

        function toggleMute() {
            audioElement.muted = !audioElement.muted;
        }

        function changePlaybackRate(rate) {
            const speed = parseFloat(rate);
            audioElement.playbackRate = speed;
        }

        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Modals management
        function openAddModal(cat) {
            modalTargetCategory = cat;
            document.getElementById('addModalTitle').innerHTML = `<i data-lucide="plus" class="w-5 h-5 text-green-500"></i> <span>Tambah ${cat} Baru</span>`;
            document.getElementById('formTitle').value = '';
            document.getElementById('formImage').value = '';
            document.getElementById('formNotes').value = '';
            
            const animeFields = document.getElementById('formAnimeFields');
            const tierFields = document.getElementById('formTierFields');
            const musicFields = document.getElementById('formMusicFields');

            animeFields.classList.add('hidden');
            tierFields.classList.add('hidden');
            musicFields.classList.add('hidden');

            if (cat === 'Anime' || cat === 'Drama') {
                animeFields.classList.remove('hidden');
            } else if (cat === 'Waifu' || cat === 'Husbu') {
                tierFields.classList.remove('hidden');
            } else if (cat === 'Lagu') {
                musicFields.classList.remove('hidden');
            }

            document.getElementById('addModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function toggleMusicInput(val) {
            const wrapper = document.getElementById('mediaUrlWrapper');
            if (val === 'yes') {
                wrapper.classList.remove('hidden');
            } else {
                wrapper.classList.add('hidden');
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('formTitle').value;
            const imageUrl = document.getElementById('formImage').value || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop';
            const notes = document.getElementById('formNotes').value;

            let status = '';
            let rating = '';
            let tier = '';
            let hasMusic = false;
            let mediaUrl = '';

            if (modalTargetCategory === 'Anime' || modalTargetCategory === 'Drama') {
                status = document.getElementById('formStatus').value;
                rating = document.getElementById('formRating').value;
            } else if (modalTargetCategory === 'Waifu' || modalTargetCategory === 'Husbu') {
                tier = document.getElementById('formTier').value;
                rating = document.getElementById('formRatingTier').value;
            } else if (modalTargetCategory === 'Lagu') {
                tier = document.getElementById('formMusicTier').value;
                rating = document.getElementById('formMusicRating').value;
                hasMusic = document.getElementById('formHasMusic').value === 'yes';
                mediaUrl = hasMusic ? document.getElementById('formMediaUrl').value : '';
            }

            const newItem = {
                id: Date.now().toString(),
                title,
                category: modalTargetCategory,
                status,
                tier,
                rating,
                imageUrl,
                notes,
                hasMusic,
                mediaUrl
            };

            items = [newItem, ...items];
            saveData();
            closeAddModal();
            renderContent();
        }

        function openDetailModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            currentDetailItem = item;

            document.getElementById('detailImg').src = item.imageUrl;
            document.getElementById('detailTitle').innerText = item.title;
            document.getElementById('detailStatus').innerText = item.status ? `Status: ${item.status}` : '';
            document.getElementById('detailNotes').innerText = item.notes || 'Belum ada catatan atau ulasan pribadi untuk item ini.';

            let badgesHTML = `<span class="px-3 py-1 rounded-full bg-green-500/20 text-green-400 text-xs font-black border border-green-500/30">${item.category}</span>`;
            if (item.rating) {
                badgesHTML += `<span class="px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-400 text-xs font-black border border-yellow-500/30 flex items-center gap-1"><i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i> ${item.rating}</span>`;
            }
            if (item.tier) {
                badgesHTML += `<span class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-black border border-emerald-500/30">Tier ${item.tier}</span>`;
            }
            document.getElementById('detailBadges').innerHTML = badgesHTML;
            document.getElementById('detailDeleteBtn').setAttribute('onclick', `closeDetailModal(); promptDelete('${item.id}')`);

            document.getElementById('detailModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function promptDelete(id) {
            itemToDeleteId = id;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            itemToDeleteId = null;
            document.getElementById('deleteModal').classList.add('hidden');
        }

        function executeDelete() {
            if (itemToDeleteId) {
                items = items.filter(i => i.id !== itemToDeleteId);
                saveData();
                if (currentSongId === itemToDeleteId) {
                    closePlayer();
                }
                closeDeleteModal();
                renderContent();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
